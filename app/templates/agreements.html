{% extends 'base.html' %}

{% block title %}
    Agreements
{% endblock %}

{% block content %}
<div class="reports-hero">
    <h1>Agreements</h1>
    <p>Browse available exchange agreements.</p>
</div>

<div class="filter-bar">
    <div class="filter-group">
        <label>Study Field</label>
        <div class="custom-dropdown" id="filter-field-container">
            <input type="hidden" id="filter-field" value="">
            <div class="dropdown-trigger">All fields</div>
            <div class="dropdown-content" style="display: none;">
                <input type="text" class="dropdown-search" placeholder="Search fields...">
                <ul class="dropdown-options"></ul>
            </div>
        </div>
    </div>
    <div class="filter-group">
        <label>Country</label>
        <div class="custom-dropdown" id="filter-country-container">
            <input type="hidden" id="filter-country" value="">
            <div class="dropdown-trigger">All countries</div>
            <div class="dropdown-content" style="display: none;">
                <input type="text" class="dropdown-search" placeholder="Search countries...">
                <ul class="dropdown-options"></ul>
            </div>
        </div>
    </div>
    <div class="filter-group">
        <label>City</label>
        <div class="custom-dropdown" id="filter-city-container">
            <input type="hidden" id="filter-city" value="">
            <div class="dropdown-trigger">All cities</div>
            <div class="dropdown-content" style="display: none;">
                <input type="text" class="dropdown-search" placeholder="Search cities...">
                <ul class="dropdown-options"></ul>
            </div>
        </div>
    </div>
    <div class="filter-group">
        <label>Institution</label>
        <div class="custom-dropdown" id="filter-institution-container">
            <input type="hidden" id="filter-institution" value="">
            <div class="dropdown-trigger">All institutions</div>
            <div class="dropdown-content" style="display: none;">
                <input type="text" class="dropdown-search" placeholder="Search institutions...">
                <ul class="dropdown-options"></ul>
            </div>
        </div>
    </div>
    <button class="btn-reset" id="reset-filters">Reset filters</button>
</div>

<div class="results-info"><span id="results-count"></span></div>
<div class="university-grid" id="agreements-container"></div>
<script>
     const AGREEMENTS_DATA = {{ agreements | tojson }};
</script>
<script src="{{ url_for('static', filename='js/filters.js') }}"></script>
{% endblock %}
