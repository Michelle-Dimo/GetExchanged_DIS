<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Min App{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}">

    <style>
        /* Expanding Search Bar - Left Anchored, Right Expanding */
        .search-container {
            display: flex;
            align-items: center;
            justify-content: flex-start; /* Keeps it strictly on the left */
        }

        .search-form {
            display: flex;
            align-items: center;
            background: transparent;
            border: 1px solid transparent;
            border-radius: 4px; /* Matches custom dropdown corners */
            overflow: hidden;
            box-sizing: border-box;
            /* Smoothly transitions the width, background, and border colors */
            transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1), 
                        border-color 0.3s ease, 
                        background-color 0.3s ease;
            width: 38px; /* Matches the button width when collapsed */
            height: 38px;
        }

        /* Expanded State styling */
        .search-form.expanded {
            background: #fff;
            border-color: #ccc;
            width: 240px; /* Total expanded width moving to the right */
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        .search-toggle-btn {
            background: transparent;
            border: none;
            width: 38px;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: #495057;
            flex-shrink: 0; /* Prevents button from squeezing when closed */
            padding: 0;
            border-radius: 4px;
            transition: background-color 0.15s ease, color 0.15s ease;
        }

        .search-toggle-btn:hover {
            background-color: #e9ecef;
            color: #212529;
        }

        /* Remove hover background inside the input panel once expanded for a cleaner card look */
        .search-form.expanded .search-toggle-btn:hover {
            background-color: transparent;
        }

        .search-input {
            width: 0;
            opacity: 0;
            border: none;
            outline: none;
            font-size: 14px;
            color: #212529;
            background: transparent;
            box-sizing: border-box;
            transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.2s ease;
            padding: 0;
        }

        .search-form.expanded .search-input {
            width: 192px; /* Remaining space for text */
            opacity: 1;
            padding: 0 12px 0 2px;
        }

        /* Clean styling for the stylish SVG icon */
        .search-icon {
            width: 18px;
            height: 18px;
            stroke: currentColor;
            stroke-width: 2.5;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
    </style>
</head>

{% with messages = get_flashed_messages() %}
  {% if messages %}
    <div class="flash-container">
      {% for message in messages %}
        <div class="flash-message">{{ message }}</div>
      {% endfor %}
    </div>
  {% endif %}
{% endwith %}

{% block scripts %}{% endblock %}

<body>
    <header class="topbar">
        <nav class="nav-left">
            <div class="search-container">
                <form method="POST" action="/search" class="search-form" id="global-search-form">
                    <button type="submit" class="search-toggle-btn" id="search-toggle-btn" aria-label="Search">
                        <svg class="search-icon" viewBox="0 0 24 24">
                            <circle cx="11" cy="11" r="8"></circle>
                            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                        </svg>
                    </button>
                    <input
                        type="text"
                        name="search"
                        id="global-search-input"
                        class="search-input"
                        placeholder="Search website..."
                        required
                        autocomplete="off"
                    >
                </form>
            </div>
        </nav>
        <div class="nav-center">
            <a href="{{ url_for('main.home') }}" class="site-title" aria-label="GetExchanged Home">
                GetExchanged
            </a>
        </div>
        <nav class="nav-right">
            <a href="{{ url_for('main.profile') }}" class="icon-btn" aria-label="Profile">👤</a>
        </nav>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer class="foot-bar">
        <div class="foot-center">
            <div class="footer-content">
                <a href="{{ url_for('main.about') }}" class="about-card" aria-label="About GetExchanged">
                    <h2>About</h2>
                    <p>Learn more about GetExchanged and how to use the platform.</p>
                </a>
            </div>
        </div>
    </footer>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const searchForm = document.getElementById("global-search-form");
            const searchInput = document.getElementById("global-search-input");
            const searchToggleBtn = document.getElementById("search-toggle-btn");

            searchToggleBtn.addEventListener("click", (e) => {
                const isExpanded = searchForm.classList.contains("expanded");
                
                if (!isExpanded) {
                    // Prevent submission on first click, expand the search field instead
                    e.preventDefault();
                    searchForm.classList.add("expanded");
                    searchInput.focus();
                } else {
                    // If open but field is empty, treat click as a close request
                    if (searchInput.value.trim() === "") {
                        e.preventDefault();
                        searchForm.classList.remove("expanded");
                    }
                    // If it contains a term, standard form POST execution continues smoothly
                }
            });

            // Collapse search box back to an icon if clicking completely outside it
            document.addEventListener("click", (e) => {
                if (!searchForm.contains(e.target) && searchInput.value.trim() === "") {
                    searchForm.classList.remove("expanded");
                }
            });
        });
    </script>
</body>
</html>
